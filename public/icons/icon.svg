<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles (top-right) -->
  <circle cx="420" cy="80" r="60" fill="url(#accentGradient)" opacity="0.15"/>
  <circle cx="450" cy="110" r="35" fill="url(#accentGradient)" opacity="0.1"/>
  
  <!-- Decorative circles (bottom-left) -->
  <circle cx="60" cy="420" r="70" fill="url(#accentGradient)" opacity="0.12"/>
  <circle cx="30" cy="450" r="40" fill="url(#accentGradient)" opacity="0.08"/>
  
  <!-- Main icon group: Book + Technology -->
  <g filter="url(#shadow)">
    <!-- Open book (education symbol) -->
    <path d="M 180 160 L 180 320 Q 180 350 210 350 L 302 350 Q 332 350 332 320 L 332 160" 
          fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Book pages/lines (left) -->
    <line x1="190" y1="180" x2="290" y2="180" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="190" y1="220" x2="290" y2="220" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="190" y1="260" x2="260" y2="260" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Book pages/lines (right) -->
    <line x1="320" y1="180" x2="220" y2="180" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="320" y1="220" x2="220" y2="220" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="320" y1="260" x2="250" y2="260" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Digital network node (technology symbol) -->
  <g filter="url(#shadow)">
    <!-- Central node -->
    <circle cx="360" cy="240" r="32" fill="url(#accentGradient)"/>
    
    <!-- Outer nodes -->
    <circle cx="400" cy="180" r="20" fill="white" opacity="0.9"/>
    <circle cx="420" cy="270" r="20" fill="white" opacity="0.9"/>
    <circle cx="360" cy="310" r="20" fill="white" opacity="0.9"/>
    <circle cx="300" cy="270" r="20" fill="white" opacity="0.9"/>
    
    <!-- Connection lines -->
    <line x1="360" y1="240" x2="400" y2="180" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <line x1="360" y1="240" x2="420" y2="270" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <line x1="360" y1="240" x2="360" y2="310" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <line x1="360" y1="240" x2="300" y2="270" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Text: FTECH -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" 
        fill="white" text-anchor="middle" letter-spacing="2">
    FTECH
  </text>
  
  <!-- Subtitle text: SCHOOL -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" 
        fill="white" text-anchor="middle" opacity="0.9" letter-spacing="1">
    SCHOOL MANAGEMENT
  </text>
</svg>
